# Wiring check without GPUs or model downloads: every stage runs with the mock VLM backend,
# a few dozen rows and tiny readers/rankers. Scores are meaningless; the point is that each
# stage reads and writes what the next one expects.
#   python -m brainiac.run --config configs/dry_run.yaml
include:
  - brainiac.yaml

experiment: dry_run
backend: mock

data:
  max_rows: 60

models:
  qwen25vl7b: {dtype: float32}
  qwen3vl8b: {dtype: float32}

train_presets:
  default: {backend: mock}
  first_place: {backend: mock}

approach_a:
  infer_backend: mock
  label_correction: {batch_size: 8}

approach_b:
  ctc: {epochs: 1, batch_size: 8, height: 32, max_width: 400, hidden: 32, num_workers: 0}
  ranker:
    outer_folds: 3
    seeds: [0, 1]
    members:
      - {name: cb_qrmse, kind: catboost_ranker, loss: QueryRMSE, depth: 3, lr: 0.1, iterations: 50, l2: 3.0}
      - {name: hgb, kind: sklearn_hgb, lr: 0.1, iterations: 50}
    early_stopping_rounds: 10
  gates: {bootstrap: 500}
