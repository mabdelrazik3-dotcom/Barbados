# Backbones. Any Qwen-VL style checkpoint that transformers loads with
# AutoModelForImageTextToText can be added here and referenced by name elsewhere.
models:
  qwen25vl7b:
    hf_id: Qwen/Qwen2.5-VL-7B-Instruct
    unsloth_id: unsloth/Qwen2.5-VL-7B-Instruct-unsloth-bnb-4bit
    local_path: null               # set to a downloaded snapshot to work offline
    dtype: bfloat16
    attn_implementation: sdpa      # flash_attention_2 when installed
    load_in_4bit: false            # true: QLoRA training / 4-bit inference (bitsandbytes)
    min_pixels: 3136               # 4 x 28 x 28   (Qwen2.5-VL: 14 px patches, 2x2 merge)
    max_pixels: 1003520            # 1280 x 28 x 28
    end_marker: "<|im_end|>"
  qwen3vl8b:
    hf_id: Qwen/Qwen3-VL-8B-Instruct
    unsloth_id: unsloth/Qwen3-VL-8B-Instruct-unsloth-bnb-4bit
    local_path: null
    dtype: bfloat16
    attn_implementation: sdpa
    load_in_4bit: false
    min_pixels: 4096               # 4 x 32 x 32   (Qwen3-VL: 16 px patches, 2x2 merge)
    max_pixels: 1048576            # 1024 x 32 x 32
    end_marker: "<|im_end|>"
  # More backbones are declared the same way when the hardware allows, e.g.
  # qwen3vl4b:  {hf_id: Qwen/Qwen3-VL-4B-Instruct, dtype: bfloat16, attn_implementation: sdpa,
  #              load_in_4bit: false, min_pixels: 4096, max_pixels: 1048576, end_marker: "<|im_end|>"}

# LoRA settings referenced by name ("lora: r64").
# targets: language   -> attention + MLP projections of the language model (vision tower frozen)
#          all_linear -> every linear layer incl. the vision tower (the 1st place tuned both)
#          [list]     -> explicit module names / a regex string
lora_presets:
  r16:          {r: 16, alpha: 16, dropout: 0.05, targets: language,   use_rslora: false}
  r32:          {r: 32, alpha: 32, dropout: 0.05, targets: language,   use_rslora: false}
  r64:          {r: 64, alpha: 64, dropout: 0.05, targets: language,   use_rslora: false}
  first_place:  {r: 16, alpha: 16, dropout: 0.35, targets: all_linear, use_rslora: false}

# Training schedules referenced by name ("train: default").
train_presets:
  default:
    backend: hf                    # hf (transformers + peft) | unsloth | mock
    epochs: 2
    max_steps: -1
    lr: 1.0e-4
    batch_size: 4
    grad_accum: 4
    warmup_ratio: 0.05
    scheduler: cosine
    weight_decay: 0.05
    max_grad_norm: 0.3
    neftune_noise_alpha: 5
    gradient_checkpointing: true
    optim: adamw_torch
    bf16: true
    num_workers: 2
    logging_steps: 10
  first_place:                     # the 1st-place schedule (Unsloth, NEFTune 5, paged 8-bit AdamW);
    backend: unsloth               # their 80 steps x batch 8 was ~1 epoch of ~700 plans -> 1 epoch here
    epochs: 1
    max_steps: -1
    lr: 1.0e-4
    batch_size: 2
    grad_accum: 4
    warmup_ratio: 0.1
    scheduler: cosine
    weight_decay: 0.05
    max_grad_norm: 0.3
    neftune_noise_alpha: 5
    gradient_checkpointing: true
    optim: paged_adamw_8bit
    bf16: true
    num_workers: 2
    logging_steps: 1
